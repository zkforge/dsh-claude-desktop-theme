<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px; background: #f4f3f0; color: #555552; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  h1 { margin: 0 0 8px; color: #232321; font-size: 19px; font-weight: 500; }
  p { margin: 0; font-size: 12px; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; gap: 16px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
  #replay { border: 1px solid #c9c8c2; border-radius: 7px; background: #fafaf9; padding: 6px 12px; font-size: 12px; }
  #replay:disabled { opacity: .6; cursor: default; }
  .examples { display: flex; align-items: start; gap: 24px; flex-wrap: wrap; }
  .sidebar { width: 282px; background: #fafaf9; padding: 10px 8px 12px 2px; border-radius: 12px; }
  .row { width: 100%; height: 32px; margin-bottom: 1px; padding: 0 8px 0 5px; display: flex; align-items: center; gap: 11px; border: 0; background: transparent; border-radius: 9px; font-size: 15px; font-weight: 400; line-height: 20px; text-align: left; }
  .row:last-child { margin: 0; }
  .row:is(:hover, :focus-visible, [data-motion="active"], [aria-pressed="true"]) { color: #151513; background: #eeedea; }
  .row svg { flex: none; width: 22px; height: 22px; }
  .row:not(:first-child) svg { width: 20px; height: 20px; margin-inline: 1px; }
  .detail { width: 282px; padding: 20px; border-radius: 12px; background: #fafaf9; }
  .detail.dark { background: #262624; color: #dddcd7; }
  .detail-label { margin-bottom: 16px; font-size: 12px; }
  .icons { display: flex; justify-content: space-between; }
  .icon-button { display: flex; border: 0; padding: 0; background: transparent; border-radius: 7px; }
  .icons svg { width: 44px; height: 44px; overflow: visible; }
  .row svg { overflow: visible; }
</style>

<script>
  const rows = [...document.querySelectorAll('.row')];
  const triggers = [...document.querySelectorAll('.claude-sidebar-trigger')];
  const replay = document.querySelector('#replay');
  const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
  let generation = 0;
  function clearDemo() {
    generation++;
    triggers.forEach(button => button.removeAttribute('data-motion'));
    replay.disabled = false;
    replay.textContent = '播放演示';
  }
  rows.forEach(row => row.addEventListener('click', () => {
    clearDemo();
    rows.forEach(button => button.setAttribute('aria-pressed', String(button === row)));
  }));
  // Actual pointer and keyboard input takes over immediately from the demo.
  triggers.forEach(button => {
    button.addEventListener('pointerenter', clearDemo);
    button.addEventListener('focus', clearDemo);
  });
  replay.addEventListener('click', async () => {
    clearDemo();
    const run = generation;
    replay.disabled = true;
    replay.textContent = '演示中…';
    for (const name of ['new', 'projects', 'artifacts', 'routines', 'customize']) {
      const group = triggers.filter(button => button.querySelector('svg').dataset.icon === name);
      group.forEach(button => button.dataset.motion = 'active');
      await delay(650);
      if (run !== generation) return;
      group.forEach(button => button.removeAttribute('data-motion'));
      await delay(300);
      if (run !== generation) return;
    }
    clearDemo();
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) clearDemo(); });
</script>
